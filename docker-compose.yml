services:
  tracker-api:
    build: ./tracker-api
    container_name: tracker-api
    ports:
      - "3001:3000"

  digest-service:
    build: ./digest-service
    container_name: digest-service
    ports:
      - "4001:4000"
    depends_on:
      - tracker-api
    environment:
      - TRACKER_API_URL=http://tracker-api:3000