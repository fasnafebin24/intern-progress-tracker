<!DOCTYPE html>
<html>
<head>
    <title>Intern Progress Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Intern Progress Tracker</h1>
</header>


<div class="container">

    <h2>Intern Summary</h2>

    <div class="card">

        <p>Total Tasks:
            <span id="totalTasks">0</span>
        </p>

        <p>Completed Tasks:
            <span id="completedTasks">0</span>
        </p>

        <p>Average Score:
            <span id="averageScore">0</span>
        </p>

    </div>

    <button onclick="loadSummary()">
        Load Summary
    </button>

</div>


<script src="script.js"></script>

</body>
</html>
